services:
  web:
    image: ghcr.io/ilybueface/socialmediaapi:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_data:/app/library/media
    environment:
      DB_HOST: db


  nginx:
    image: nginx:1.31
    ports:
      - '80:80'
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/library/media

  db:
    image: postgres:16
    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  media_data:
