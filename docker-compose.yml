services:
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_data:/app/library/media
    environment:
      DB_HOST: db
      CELERY_BROKER: redis://redis:6379/0
      CELERY_BACKEND: redis://redis:6379/0


  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'
    depends_on:
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/library/media

  db:
    image: postgres:16
    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: telegram_bot/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  redis:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  media_data:
  redis_data:
